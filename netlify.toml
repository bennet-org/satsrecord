# Netlify hosts apps/web (the adapter switches on NETLIFY=true in astro.config.ts). Base directory stays the
# repo root so pnpm installs the workspace; set "Package directory" to apps/web in the site settings so Netlify
# picks up the functions the adapter writes to apps/web/.netlify/v1/. The worker (Phase 7) is not serverless
# and will live next to the node; this file is the web app only.
[build]
  command = "pnpm --filter @satsrecord/core db:migrate && pnpm --filter @satsrecord/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

# Plausible, proxied first-party. Script path comes from the Plausible dashboard.
[[redirects]]
  from = "/js/script.js"
  to = "https://plausible.io/js/pa-4B9wyKx3IAFJ0q4KpBUIr.js"
  status = 200
  force = true

[[redirects]]
  from = "/api/event"
  to = "https://plausible.io/api/event"
  status = 200
  force = true

# satsrecord.com is held but not canonical.
[[redirects]]
  from = "https://satsrecord.com/*"
  to = "https://satsrecord.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.satsrecord.com/*"
  to = "https://satsrecord.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.satsrecord.org/*"
  to = "https://satsrecord.org/:splat"
  status = 301
  force = true

# Static pages never reach the middleware.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
