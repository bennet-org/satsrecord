services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: satsrecord
      POSTGRES_PASSWORD: satsrecord
      POSTGRES_DB: satsrecord_demo
    ports: ["127.0.0.1:5437:5432"]
    volumes: ["demo_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satsrecord -d satsrecord_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  demo_pgdata:
