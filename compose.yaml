services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: satsrecord
      POSTGRES_PASSWORD: satsrecord
      POSTGRES_DB: satsrecord
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  web:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://satsrecord:satsrecord@db:5432/satsrecord
      HOST: 0.0.0.0
      PORT: "4321"
    ports: ["4321:4321"]
volumes:
  pgdata:
